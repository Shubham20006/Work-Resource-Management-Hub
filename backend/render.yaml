services:
  - type: web
    name: workhub-api
    env: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: CLIENT_URL
        value: http://localhost:5173,https://your-frontend-url.onrender.com
    healthCheckPath: /api/health
